<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Clone</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="icon" type="image/png" href="./icon.png" />
  </head>
  <body>
    <header>
      <nav aria-label="Servicios de Google">
        <ul class="nav-right-section">
          <li>
            <a href="https://mail.google.com/">Gmail</a>
          </li>
          <li>
            <a href="https://www.google.com/imghp">Imágenes</a>
          </li>
          <li>
            <a
              class="icon-button"
              href="https://about.google/products/"
              aria-label="Aplicaciones de Google"
              title="Aplicaciones de Google"
            >
              <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
                <path
                  fill="currentColor"
                  d="M6 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM6 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"
                />
              </svg>
            </a>
          </li>
          <li>
            <a
              class="avatar"
              href="https://myaccount.google.com/"
              aria-label="Cuenta de Google"
              title="Cuenta de Google"
              >C</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <h1 class="main-logo" aria-label="Google">
        <span class="g-blue">G</span><span class="g-red">o</span
        ><span class="g-yellow">o</span><span class="g-blue">g</span
        ><span class="g-green">l</span><span class="g-red">e</span>
      </h1>

      <form class="search-form" action="https://www.google.com/search" method="get" role="search">
        <div class="main-input-container">
          <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
            />
          </svg>
          <input
            type="search"
            name="q"
            aria-label="Buscar"
            title="Buscar"
            autocomplete="off"
            autofocus
          />
          <a
            class="icon-button micro-icon"
            href="https://www.google.com/search?q=b%C3%BAsqueda+por+voz"
            aria-label="Búsqueda por voz"
            title="Búsqueda por voz"
          >
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
              <path fill="#4285f4" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z" />
              <path fill="#34a853" d="M11 18.92h2V22h-2z" />
              <path fill="#fbbc04" d="M7 12H5c0 1.93.78 3.68 2.05 4.95l1.41-1.41A5 5 0 0 1 7 12z" />
              <path
                fill="#ea4335"
                d="M12 17a5 5 0 0 1-3.54-1.46l-1.41 1.41A6.98 6.98 0 0 0 12 19a6.98 6.98 0 0 0 4.95-2.05l-1.41-1.41A5 5 0 0 1 12 17zm5-5a5 5 0 0 1-1.46 3.54l1.41 1.41A6.98 6.98 0 0 0 19 12h-2z"
              />
            </svg>
          </a>
        </div>

        <div class="main-buttons">
          <button type="submit">Buscar con Google</button>
          <button type="submit" name="btnI" value="1">Me siento con suerte</button>
        </div>
      </form>
    </main>

    <footer>
      <ul class="footer-left">
        <li><a href="https://ads.google.com/">Publicidad</a></li>
        <li><a href="https://www.google.com/services/">Negocios</a></li>
        <li><a href="https://about.google/">Acerca de</a></li>
        <li><a href="https://www.google.com/search/howsearchworks/">Cómo funciona la búsqueda</a></li>
      </ul>
      <ul class="footer-right">
        <li><a href="https://policies.google.com/privacy">Privacidad</a></li>
        <li><a href="https://policies.google.com/terms">Condiciones</a></li>
        <li><a href="https://www.google.com/preferences">Preferencias</a></li>
      </ul>
    </footer>
  </body>
</html>
