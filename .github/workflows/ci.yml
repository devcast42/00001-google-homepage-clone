name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Construir frontend e índice
        run: npm run build && npm run index
      - name: Calidad del ranking (falla si el MRR baja)
        run: |
          npm run bench:relevance -- --min-mrr 0.75
          npm run bench:relevance -- --set holdout --min-mrr 0.65
      - name: Latencia del motor
        run: npm run bench:latency >> "$GITHUB_STEP_SUMMARY"
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Pruebas de extremo a extremo y accesibilidad
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: docseek:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prueba de humo del contenedor
        run: |
          docker run -d --name docseek -p 3000:3000 docseek:ci
          for i in $(seq 30); do curl -sf localhost:3000/readyz && break; sleep 1; done
          curl -sf 'localhost:3000/api/search?q=readFile' | grep -q 'fs.readFile'
          docker stop docseek
